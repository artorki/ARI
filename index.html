<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Instrument</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #09090b; /* Zinc 950 */
            color: #fafafa;
            min-height: 100vh;
        }

        .btn-card {
            background-color: #18181b; /* Zinc 900 */
            border: 1px solid #27272a; /* Zinc 800 */
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-card:hover {
            background-color: #1f1f23; /* Zinc 800/900 hover */
            border-color: #3f3f46; /* Zinc 700 */
            transform: translateY(-2px);
        }

        .btn-card:active {
            transform: translateY(0);
        }

        .icon-wrapper {
            background-color: #27272a; /* Zinc 800 */
            transition: all 0.3s ease;
        }

        .btn-card:hover .icon-wrapper {
            background-color: #ffffff;
            color: #09090b;
        }

        .btn-card:hover .icon-wrapper svg {
            color: #18181b;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeInUp 0.5s ease forwards;
            opacity: 0;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: #ffffff;
            color: #09090b;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-6 py-12">
    
    <!-- Main Content -->
    <div class="w-full max-w-3xl">
        
        <!-- Header -->
        <header class="text-center mb-12 fade-in" style="animation-delay: 0.1s;">
            <div class="w-12 h-1 bg-zinc-700 rounded-full mx-auto mt-6"></div>
        </header>

        <!-- Buttons Grid -->
        <div id="buttonsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Buttons will be injected by JavaScript -->
        </div>

        <!-- Footer -->
        <footer class="mt-16 text-center fade-in" style="animation-delay: 0.9s;">
        </footer>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">پیام</div>

    <script>
        // ===== لینک‌ها را اینجا ویرایش کنید =====
        const links = [
            {
                title: 'سنتور',
                desc: 'سنتور',
                url: 'Santoor.html',
                icon: `<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>`
            },
            {
                title: 'پیانو',
                desc: 'پیانو',
                url: 'Piano.html',
                icon: `<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>`
            },
            {
                title: 'هنگ‌درام',
                desc: 'هنگ‌درام',
                url: 'Hangdrum.html',
                icon: `<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`
            },
            {
                title: 'درام',
                desc: 'درام',
                url: 'Drum.html',
                icon: `<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>`
            }
        ];

        // Render buttons
        const grid = document.getElementById('buttonsGrid');
        links.forEach((link, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn-card fade-in rounded-xl p-5 text-right flex items-center gap-4';
            btn.style.animationDelay = `${0.2 + index * 0.08}s`;
            
            btn.innerHTML = `
                <div class="icon-wrapper w-12 h-12 rounded-lg flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-zinc-300 transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        ${link.icon}
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 class="font-semibold text-base mb-1 truncate">${link.title}</h3>
                    <p class="text-zinc-500 text-sm truncate">${link.desc}</p>
                </div>
                <svg class="w-5 h-5 text-zinc-600 flex-shrink-0 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            `;
            
            btn.addEventListener('click', () => openLink(link.url));
            grid.appendChild(btn);
        });

        // Open link function
        function openLink(url) {
            if (url && url !== '#' && url !== '') {
                window.open(url, '_blank');
            } else {
                showToast('لینک هنوز تنظیم نشده است');
            }
        }

        // Toast notification
        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
